function renderPeopleAnalysis(){
 const root=document.getElementById("phAnalysisData"),rows=window.BUYAKA_SD_KARNE_ROWS||[],league=window.BUYAKA_LEAGUE_DATA?.staff||[];
 if(!root)return;
 if(!rows.length&&!league.length){root.innerHTML='<div class="ph-empty">Personel analizi için SD Karne ve Performance League Excel verileri yüklenemedi.</div>';return;}
 const month=window.BUYAKA_LEAGUE_DATA?.month||"2026-11",parts=month.split("-").map(Number),days=new Date(parts[0],parts[1],0).getDate(),now=new Date(),currentMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"),elapsed=month===currentMonth?Math.min(days,now.getDate()):(month<currentMonth?days:0);
 const teamAvg=key=>rows.reduce((n,x)=>n+(Number(x[key])||0),0)/(rows.length||1);
 const sdComments=p=>{
  const items=[];
  const add=(label,value,target,goodText,badText,unit="")=>{
   if(!Number.isFinite(Number(value))||Number(value)===0){items.push('<div class="ph-analysis-line"><b>'+label+'</b><span>Veri bulunmadığı için değerlendirme yapılamadı.</span></div>');return;}
   const good=Number(value)>=target;
   items.push('<div class="ph-analysis-line '+(good?'is-good':'is-focus')+'"><b>'+label+' · '+phNum(value,2)+unit+'</b><span>'+(good?goodText:badText)+'</span></div>');
  };
  add("UPT",p.upt,1.8,"1,80 hedefini karşılıyor veya aşıyor; tamamlayıcı ürün önerilerini sürdür.","1,80 hedefinin altında. Her satışta ihtiyaca uygun ikinci ürün ve kombin önerisine odaklan.");
  add("CR",p.cr,7,"%7 mağaza hedefini karşılıyor veya aşıyor; satış kapanış kalitesini koru.","%7 mağaza hedefinin altında. İhtiyaç analizi, ürün denetimi ve satış kapanış adımlarını güçlendir.","%");
  if(Number(p.hgo)>0)add("Ciro HGO",p.hgo,100,"%100 hedef gerçekleşmesine ulaşmış veya geçmiş.","Ciro hedef gerçekleşmesi %100'ün altında. Kalan ciro açığını günlük satış hedefine bölerek takip et.","%");
  [["Ciro","ciro"],["ATV","atv"],["ASP","asp"]].forEach(([label,key])=>{const avg=teamAvg(key),v=Number(p[key])||0;if(!v||!avg)return;const good=v>=avg;items.push('<div class="ph-analysis-line '+(good?'is-good':'is-focus')+'"><b>'+label+' · '+phMoney(v)+'</b><span>'+(good?'Ekip ortalaması '+phMoney(avg)+' seviyesinin üzerinde.':'Ekip ortalaması '+phMoney(avg)+' seviyesinin '+phMoney(avg-v)+' altında. Sepet tutarı ve ürün değerini artıracak ürün sunumlarına odaklan.')+'</span></div>');});
  return items.join("");
 };
 const leagueComments=p=>{
  const invExpected=Number(p.dailyInvoice||0)*elapsed,unitExpected=Number(p.dailyUnits||0)*elapsed;
  const invGap=Number(p.invoices||0)-invExpected,unitGap=Number(p.units||0)-unitExpected;
  const invMonth=Number(p.invoiceTarget)?Number(p.invoices||0)/Number(p.invoiceTarget)*100:0,unitMonth=Number(p.unitTarget)?Number(p.units||0)/Number(p.unitTarget)*100:0;
  const line=(label,actual,target,expected,gap,monthRate)=>{
   const ahead=gap>=0,remaining=Math.max(0,days-elapsed),needed=Math.max(0,(Number(target)-Number(actual||0))/Math.max(1,remaining));
   return '<div class="ph-analysis-line '+(ahead?'is-good':'is-focus')+'"><b>'+label+' · '+phNum(actual)+' / '+phNum(target)+' · aylık hedefin %'+phNum(monthRate,1)+'’i</b><span>Bugüne kadar beklenen: '+phNum(expected,1)+'. '+(ahead?'Aylık tempoda '+phNum(gap,1)+' '+(label==="Fatura"?'fatura':'ürün')+' önde.':'Aylık tempoda '+phNum(Math.abs(gap),1)+' '+(label==="Fatura"?'fatura':'ürün')+' geride; kalan '+remaining+' günde hedefe ulaşmak için günlük ortalama '+phNum(needed,1)+' '+(label==="Fatura"?'fatura':'ürün')+' gerekli.')+'</span></div>';
  };
  return line("Fatura",p.invoices,p.invoiceTarget,invExpected,invGap,invMonth)+line("Ürün",p.units,p.unitTarget,unitExpected,unitGap,unitMonth);
 };
 const names=[...new Set([...rows.map(p=>p.name),...league.map(p=>p.name)])];
 root.innerHTML='<div class="ph-analysis-intro">SD Karne KPI değerlendirmesi ile Performance League aylık hedef temposu kişi bazında birleştirilmiştir. Aylık tempo, ilgili ayın bugüne kadar geçen gününe göre hesaplanır.</div><div class="ph-analysis-grid">'+names.map(name=>{

 }).join("")+'</div>';

let productGuideRows=[];
let productGuideCategory="AYAKKABI";
const pgNorm=v=>String(v??"").toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");
function pgFind(headers,aliases){const h=headers.map(pgNorm);for(const a of aliases){const i=h.findIndex(x=>x===pgNorm(a));if(i>=0)return i;}return -1;}
function pgCleanCode(v){return String(v??"").trim().replace(/\\.0$/,"");}
function pgNumber(v){if(typeof v==="number")return Number.isFinite(v)?v:0;let x=String(v??"").trim().replace(/[^0-9,.-]/g,"");if(!x)return 0;if(x.includes(",")&&x.includes("."))x=x.replace(/\\./g,"").replace(",",".");else if(x.includes(","))x=x.replace(",",".");return Number(x)||0;}
function pgMoney(v){return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(pgNumber(v))+" TL";}
function pgCategory(v){const n=pgNorm(v);if(n.includes("ayakkabi")||n==="ftw"||n==="footwear")return "AYAKKABI";if(n.includes("tekstil")||n==="app"||n==="apparel")return "TEKSTİL";if(n.includes("aksesuar")||n==="acc"||n==="accessories")return "AKSESUAR";return String(v||"DİĞER").trim().toLocaleUpperCase("tr-TR");}
async function renderProductGuide(){
 const root=document.getElementById("productGuideRoot");if(!root)return;
 root.innerHTML='<div class="card">Gerçek satış ve stok kayıtları eşleştiriliyor...</div>';
 try{
  const [salesBook,stockResponse]=await Promise.all([loadExcel("Satış Verileri.xlsx"),fetch("../data.json",{cache:"no-store"})]);
  if(!stockResponse.ok)throw new Error("Güncel stok verisi data.json üzerinden alınamadı ("+stockResponse.status+").");
  const stockRows=await stockResponse.json();
  const stockMap=new Map();
  (Array.isArray(stockRows)?stockRows:[]).forEach(x=>{const code=pgCleanCode(x.productCode||x["Ürün Kodu"]||x["Stok Kodu"]);if(!code)return;const cur=stockMap.get(code)||{stock:0,sizes:new Set(),name:x.productName||"",category:x.category||"",gender:x.gender||"",season:x.season||""};cur.stock+=pgNumber(x.stock??x["Stok Adedi"]);if(x.size)cur.sizes.add(String(x.size));if(!cur.name)cur.name=x.productName||"";if(!cur.category)cur.category=x.category||"";if(!cur.gender)cur.gender=x.gender||"";if(!cur.season)cur.season=x.season||"";stockMap.set(code,cur);});
  const salesMap=new Map();
  salesBook.sheets.forEach(sh=>{
   const h=sh.headers;
   const ix={category:pgFind(h,["Kategori","Puma Kategori"]),gender:pgFind(h,["Cinsiyet"]),code:pgFind(h,["Ürün kodu","Ürün Kodu","Stok Kodu"]),name:pgFind(h,["Ürün Adı","Ürün İsmi","Product Name"]),qty:pgFind(h,["Satış Adedi","Net Satış Adedi","Satış Miktarı"]),revenue:pgFind(h,["Satış Tutarı","Net Satış Tutarı","Net Satış Tutarı (KDV Hariç)"])};
   if(ix.code<0||ix.name<0||ix.qty<0) return;
   sh.rows.forEach(r=>{
    const code=pgCleanCode(r[ix.code]),name=String(r[ix.name]||"").trim(),category=pgCategory(ix.category>=0?r[ix.category]:"DİĞER");
    if(!code||!name||category==="POŞET")return;

    cur.qty+=pgNumber(r[ix.qty]);if(ix.revenue>=0)cur.revenue+=pgNumber(r[ix.revenue]);if(!cur.gender&&ix.gender>=0)cur.gender=String(r[ix.gender]||"").trim();

   });
  });

  if(!cats.includes(productGuideCategory))productGuideCategory=cats[0]||"";
  root.innerHTML='<div class="card" style="margin-bottom:14px"><div class="card-title"><div><h3>Kategori Bazlı Satış ve Stok Analizi</h3><span>Satış verileri ürün koduna göre gruplanır · stok bedenler toplanarak hesaplanır</span></div><span>'+productGuideRows.length+' ürün</span></div><div id="pgCategoryTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px">'+cats.map(c=>'<button type="button" data-pg-cat="'+esc(c)+'" onclick="selectProductGuideCategory(this.dataset.pgCat)" style="border:1px solid '+(c===productGuideCategory?'#e31b36':'var(--line)')+';background:'+(c===productGuideCategory?'#fff0f2':'#fff')+';color:'+(c===productGuideCategory?'#e31b36':'#555')+';border-radius:8px;padding:10px 15px;font-weight:800">'+esc(c)+'</button>').join("")+'</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px"><input id="pgSearch" oninput="filterProductGuide()" placeholder="Ürün adı veya ürün kodu ara..." style="padding:11px;border:1px solid var(--line);border-radius:8px"><select id="pgSort" onchange="filterProductGuide()" style="padding:11px;border:1px solid var(--line);border-radius:8px;background:white"><option value="qty">Satış adedi: yüksekten düşüğe</option><option value="revenue">Ciro: yüksekten düşüğe</option><option value="stock">Kalan stok: azdan çoğa</option><option value="name">Ürün adı: A-Z</option></select></div></div><div id="pgSummary" class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px"></div><div class="card"><div class="card-title"><h3 id="pgTableTitle">Ürün Satış Listesi</h3><span id="pgCount"></span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:900px;font-size:13px"><thead><tr style="text-align:left;border-bottom:2px solid var(--line)"><th style="padding:12px">Ürün Adı</th><th style="padding:12px">Ürün Kodu</th><th style="padding:12px">Cinsiyet</th><th style="padding:12px;text-align:right">Satış Adedi</th><th style="padding:12px;text-align:right">Satış Cirosu</th><th style="padding:12px;text-align:right">Kalan Stok</th><th style="padding:12px;text-align:right">Beden Çeşidi</th><th style="padding:12px">Stok Durumu</th></tr></thead><tbody id="pgRows"></tbody></table></div><div id="pgEmpty" class="insight" style="display:none">Bu kategoride arama kriterine uygun ürün bulunamadı.</div></div>';

async function loadExcel(file){
 if(excelCache[file])return excelCache[file];
 if(!window.XLSX)throw new Error("Excel okuma kütüphanesi yüklenemedi. İnternet bağlantısını kontrol et.");
 const folder=excelPathMap[file]||"";
 const url="https://raw.githubusercontent.com/dagitmacmustafaberaat-create/puma-smart-assistant/main/"+folder+encodeURIComponent(file).replace(/%2F/g,"/");
 const res=await fetch(url,{cache:"no-store"});
 if(!res.ok)throw new Error(file+" indirilemedi ("+res.status+").");
 const wb=XLSX.read(await res.arrayBuffer(),{type:"array",cellDates:true});
 const parsed={name:file,sheets:[]};
 wb.SheetNames.forEach(sheetName=>{
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:"",raw:false});
  let headerIndex=0,best=-1;
  raw.slice(0,20).forEach((row,i)=>{const score=row.filter(v=>String(v).trim()!=="").length;if(score>best){best=score;headerIndex=i}});
  const headers=(raw[headerIndex]||[]).map((v,i)=>String(v||"Sütun "+(i+1)).trim()||"Sütun "+(i+1));
  const rows=raw.slice(headerIndex+1).filter(row=>row.some(v=>String(v).trim()!==""));
  parsed.sheets.push({name:sheetName,headers,rows,total:rows.length});
 });
 excelCache[file]=parsed;return parsed;
}

function normHead(v){return String(v||"").toLocaleLowerCase("tr-TR").replace(/[ıİ]/g,"i").replace(/[ş]/g,"s").replace(/[ğ]/g,"g").replace(/[ü]/g,"u").replace(/[ö]/g,"o").replace(/[ç]/g,"c").replace(/[^a-z0-9]/g,"")}
function findCol(headers,terms){return headers.findIndex(h=>terms.some(t=>normHead(h).includes(t)))}
function asNum(v){if(typeof v==="number")return v;let s=String(v??"").trim().replaceAll(" ","").replaceAll("₺","");if(!s)return 0;if(s.includes(",")&&s.includes("."))s=s.replaceAll(".","").replace(",",".");else if(s.includes(","))s=s.replace(",",".");const n=Number(s);return Number.isFinite(n)?n:0}
