function renderPeopleAnalysis(){
 const root=document.getElementById("phAnalysisData"),rows=window.BUYAKA_SD_KARNE_ROWS||[],league=window.BUYAKA_LEAGUE_DATA?.staff||[];
 if(!root)return;
 if(!rows.length&&!league.length){root.innerHTML='<div class="ph-empty">Personel analizi için SD Karne ve Performance League Excel verileri yüklenemedi.</div>';return;}
 const month=window.BUYAKA_LEAGUE_DATA?.month||"2026-11",parts=month.split("-").map(Number),days=new Date(parts[0],parts[1],0).getDate(),now=new Date(),currentMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"),elapsed=month===currentMonth?Math.min(days,now.getDate()):(month<currentMonth?days:0);
 const teamAvg=key=>rows.reduce((n,x)=>n+(Number(x[key])||0),0)/(rows.length||1);
 const sdComments=p=>{
  const items=[];
  const add=(label,value,target,goodText,badText,unit="")=>{
   if(!Number.isFinite(Number(value))||Number(value)===0){items.push('<div class="ph-analysis-line"><b>'+label+'</b><span>Veri bulunmadığı için değerlendirme yapılamadı.</span></div>');return;}
   const good=Number(value)>=target;
   items.push('<div class="ph-analysis-line '+(good?'is-good':'is-focus')+'"><b>'+label+' · '+phNum(value,2)+unit+'</b><span>'+(good?goodText:badText)+'</span></div>');
  };
  add("UPT",p.upt,1.8,"1,80 hedefini karşılıyor veya aşıyor; tamamlayıcı ürün önerilerini sürdür.","1,80 hedefinin altında. Her satışta ihtiyaca uygun ikinci ürün ve kombin önerisine odaklan.");

  [["Ciro","ciro"],["ATV","atv"],["ASP","asp"]].forEach(([label,key])=>{const avg=teamAvg(key),v=Number(p[key])||0;if(!v||!avg)return;const good=v>=avg;items.push('<div class="ph-analysis-line '+(good?'is-good':'is-focus')+'"><b>'+label+' · '+phMoney(v)+'</b><span>'+(good?'Ekip ortalaması '+phMoney(avg)+' seviyesinin üzerinde.':'Ekip ortalaması '+phMoney(avg)+' seviyesinin '+phMoney(avg-v)+' altında. Sepet tutarı ve ürün değerini artıracak ürün sunumlarına odaklan.')+'</span></div>');});
  return items.join("");
 };
 const leagueComments=p=>{
  const invExpected=Number(p.dailyInvoice||0)*elapsed,unitExpected=Number(p.dailyUnits||0)*elapsed;
  const invGap=Number(p.invoices||0)-invExpected,unitGap=Number(p.units||0)-unitExpected;
  const invMonth=Number(p.invoiceTarget)?Number(p.invoices||0)/Number(p.invoiceTarget)*100:0,unitMonth=Number(p.unitTarget)?Number(p.units||0)/Number(p.unitTarget)*100:0;
  const line=(label,actual,target,expected,gap,monthRate)=>{
   const ahead=gap>=0,remaining=Math.max(0,days-elapsed),needed=Math.max(0,(Number(target)-Number(actual||0))/Math.max(1,remaining));

  };

 };

 root.innerHTML='<div class="ph-analysis-intro">SD Karne KPI değerlendirmesi ile Performance League aylık hedef temposu kişi bazında birleştirilmiştir. Aylık tempo, ilgili ayın bugüne kadar geçen gününe göre hesaplanır.</div><div class="ph-analysis-grid">'+names.map(name=>{

let productGuideRows=[];
let productGuideCategory="AYAKKABI";
const pgNorm=v=>String(v??"").toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");
function pgFind(headers,aliases){const h=headers.map(pgNorm);for(const a of aliases){const i=h.findIndex(x=>x===pgNorm(a));if(i>=0)return i;}return -1;}
function pgCleanCode(v){return String(v??"").trim().replace(/\\.0$/,"");}
function pgNumber(v){if(typeof v==="number")return Number.isFinite(v)?v:0;let x=String(v??"").trim().replace(/[^0-9,.-]/g,"");if(!x)return 0;if(x.includes(",")&&x.includes("."))x=x.replace(/\\./g,"").replace(",",".");else if(x.includes(","))x=x.replace(",",".");return Number(x)||0;}
function pgMoney(v){return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(pgNumber(v))+" TL";}
function pgCategory(v){const n=pgNorm(v);if(n.includes("ayakkabi")||n==="ftw"||n==="footwear")return "AYAKKABI";if(n.includes("tekstil")||n==="app"||n==="apparel")return "TEKSTİL";if(n.includes("aksesuar")||n==="acc"||n==="accessories")return "AKSESUAR";return String(v||"DİĞER").trim().toLocaleUpperCase("tr-TR");}

function filterWeeklyCompare(value){
 const root=document.getElementById("weeklyCompareResults");if(!root)return;
 root.querySelectorAll("[data-compare-week]").forEach((week,wi)=>{
  const days=week.querySelectorAll("[data-compare-day]");
  const total=week.querySelector("[data-compare-total]");
  let showWeek=value==="all"||value==="week-"+wi;
  let showDay=false;
  days.forEach(day=>{
   const match=value==="all"||(value==="week-"+wi)||(value.startsWith("day-")&&Number(value.slice(4))===Number(day.dataset.compareDay));
   day.style.display=match?"":"none";if(match&&value.startsWith("day-"))showDay=true;
  });
  if(total)total.style.display=(value==="all"||value==="week-"+wi)?"":"none";
  week.style.display=(showWeek||showDay)?"":"none";
 });
}
