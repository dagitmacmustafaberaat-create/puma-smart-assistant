function showPeopleTab(tab){
 document.querySelectorAll("[data-ph-tab]").forEach(b=>b.classList.toggle("active",b.dataset.phTab===tab));
 document.querySelectorAll("[data-ph-panel]").forEach(p=>p.classList.toggle("active",p.dataset.phPanel===tab));
}
const phNum=(v,d=0)=>new Intl.NumberFormat("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(v)||0);
const phMoney=v=>phNum(v,0)+" TL";
function renderPeopleSD(){
 const root=document.getElementById("phSdData"),rows=(window.BUYAKA_SD_KARNE_ROWS||[]);
 if(!root)return;
 if(!rows.length){root.innerHTML='<div class="ph-empty">SD Karne Excel verisi okunamadı.</div>';return;}
 const total=rows.reduce((n,p)=>n+Number(p.ciro||0),0),upt=rows.reduce((n,p)=>n+Number(p.upt||0),0)/rows.length,cr=rows.reduce((n,p)=>n+Number(p.cr||0),0)/rows.length;
 const cards=rows.slice().sort((a,b)=>b.ciro-a.ciro).map((p,i)=>'<article class="ph-person"><div class="ph-person-top"><div><strong>'+p.name+'</strong><small>PERSONEL PERFORMANS KARNESİ</small></div><span class="ph-rank">#'+(i+1)+'</span></div><div class="ph-bonus">AY SONU KAZANÇ<b>'+phMoney(p.bonus)+'</b></div><div class="ph-metrics">'+[['CİRO',phMoney(p.ciro)],['FATURA',p.hasInvoices?phNum(p.invoices):'—'],['ÜRÜN',p.hasProducts?phNum(p.products):'—'],['UPT',phNum(p.upt,2)],['ATV',phMoney(p.atv)],['ASP',phMoney(p.asp)],['CR',phNum(p.cr,2)+'%'],['AY SONU CİRO',p.closingRevenue?phMoney(p.closingRevenue):'—'],['HGO',p.hgo?phNum(p.hgo,1)+'%':'—']].map(m=>'<div class="ph-metric"><small>'+m[0]+'</small><b>'+m[1]+'</b></div>').join('')+'</div></article>').join('');
 root.innerHTML='<div class="ph-stats"><div class="ph-stat"><small>EKİP CİROSU</small><strong>'+phMoney(total)+'</strong></div><div class="ph-stat"><small>ORTALAMA UPT</small><strong>'+phNum(upt,2)+'</strong></div><div class="ph-stat"><small>ORTALAMA CR</small><strong>'+phNum(cr,2)+'%</strong></div></div><div class="ph-people-grid">'+cards+'</div>';
}
function renderPeopleLeague(){
 const root=document.getElementById("phLeagueData"),data=window.BUYAKA_LEAGUE_DATA;
 if(!root)return;if(!data?.staff?.length){root.innerHTML='<div class="ph-empty">Kasım hedef Excel verisi okunamadı.</div>';return;}
 const ranked=data.staff.map(p=>({...p,ir:p.invoiceTarget?p.invoices/p.invoiceTarget*100:0,ur:p.unitTarget?p.units/p.unitTarget*100:0})).sort((a,b)=>(b.ir+b.ur)-(a.ir+a.ur));
 const ti=ranked.reduce((n,p)=>n+p.invoices,0),tu=ranked.reduce((n,p)=>n+p.units,0),tIt=ranked.reduce((n,p)=>n+p.invoiceTarget,0),tUt=ranked.reduce((n,p)=>n+p.unitTarget,0);
 root.innerHTML='<div class="ph-stats"><div class="ph-stat"><small>FATURA GERÇEKLEŞMESİ</small><strong>'+phNum(ti)+' / '+phNum(tIt)+'</strong></div><div class="ph-stat"><small>ÜRÜN GERÇEKLEŞMESİ</small><strong>'+phNum(tu)+' / '+phNum(tUt)+'</strong></div><div class="ph-stat"><small>AYIN LİDERİ</small><strong style="font-size:14px">'+ranked[0].name+'</strong></div></div><div class="ph-league-grid">'+ranked.map((p,i)=>'<article class="ph-league"><div class="ph-person-top"><div class="ph-league-top"><strong>'+p.name+'</strong><small>'+p.role+'</small></div><b class="ph-score">%'+phNum((p.ir+p.ur)/2,1)+'</b></div><div class="ph-progress"><div class="ph-progress-head"><span>FATURA HEDEFİ</span><b>'+phNum(p.invoices)+' / '+phNum(p.invoiceTarget)+' · %'+phNum(p.ir,1)+'</b></div><div class="ph-track"><i style="width:'+Math.min(100,p.ir)+'%"></i></div></div><div class="ph-progress"><div class="ph-progress-head"><span>ÜRÜN HEDEFİ</span><b>'+phNum(p.units)+' / '+phNum(p.unitTarget)+' · %'+phNum(p.ur,1)+'</b></div><div class="ph-track"><i style="width:'+Math.min(100,p.ur)+'%"></i></div></div><div class="ph-daily"><span>GÜNLÜK HEDEF</span><b>'+phNum(p.dailyInvoice,1)+' FATURA</b><b>'+phNum(p.dailyUnits,1)+' ÜRÜN</b></div></article>').join('')+'</div>';
}
function renderPeopleWeekly(){
 const root=document.getElementById("phWeeklyData"),rows=window.BUYAKA_SD_KARNE_ROWS||[],league=window.BUYAKA_LEAGUE_DATA?.staff||[];
 if(!root)return;if(!rows.length){root.innerHTML='<div class="ph-empty">Şampiyonlar için SD Karne verisi gerekli.</div>';return;}
 const enriched=rows.map(p=>{const l=league.find(x=>x.name===p.name),inv=Number(l?.invoices)||Number(p.invoices)||0;return {...p,atv:inv?p.ciro/inv:0};});
 const specs=[["CİRO ŞAMPİYONU","ciro",phMoney],["UPT ŞAMPİYONU","upt",v=>phNum(v,2)+" UPT"],["ATV ŞAMPİYONU","atv",phMoney],["CR ŞAMPİYONU","cr",v=>phNum(v,2)+"%"]];
 root.innerHTML='<div class="ph-champs">'+specs.map(([label,key,fmt])=>{const p=enriched.reduce((a,b)=>b[key]>a[key]?b:a);return '<article class="ph-champ"><small>'+label+'</small><strong>'+p.name+'</strong><b>'+fmt(p[key])+'</b></article>';}).join('')+'</div>';
}
function renderPeopleEducation(){
 const root=document.getElementById("phEducationData"),data=window.BUYAKA_TRAINING_DATA;if(!root)return;

 const opts=dates.map(d=>'<option value="'+d+'" '+(d===selected?'selected':'')+'>'+d.split('-').reverse().join('.')+'</option>').join('');
 const docs=(data.library||[]).map(d=>'<div class="ph-doc"><span>'+d.icon+'</span><b>'+d.title+'</b><a href="../'+encodeURIComponent(d.file).replace(/%2F/g,'/')+'" target="_blank" rel="noopener">AÇ ↗</a></div>').join('');
 root.innerHTML='<div class="ph-education"><section class="ph-subcard"><h4>GÜNLÜK GELİŞİM PLANI</h4><select class="ph-select" id="phEduDate" onchange="renderPeopleEducationDay(this.value)">'+opts+'</select><div id="phEduTopics"></div></section><section class="ph-subcard"><h4>ÖĞRENME KÜTÜPHANESİ</h4>'+docs+'</section></div>';

}
function renderPeopleEducationDay(date){

}
function togglePeopleOriginal(){
 const wrap=document.getElementById("phOriginal"),btn=document.getElementById("phOriginalBtn");if(!wrap)return;
 const open=wrap.hidden;wrap.hidden=!open;btn.textContent=open?"📂 ORİJİNAL TABLOYU GİZLE":"📂 ORİJİNAL TABLOYU AÇ";

async function initPeopleHub(force=false){
 const status=document.getElementById("phStatus");if(status)status.textContent="Excel kaynakları okunuyor…";
 const jobs=[];
 if(typeof window.loadSDKarneData==="function")jobs.push(window.loadSDKarneData());

 if(typeof window.loadTrainingCalendarWorkbook==="function")jobs.push(window.loadTrainingCalendarWorkbook());
 await Promise.allSettled(jobs);
 renderPeopleSD();renderPeopleLeague();renderPeopleWeekly();renderPeopleEducation();

const pgNorm=v=>String(v??"").toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");
function pgFind(headers,aliases){const h=headers.map(pgNorm);for(const a of aliases){const i=h.findIndex(x=>x===pgNorm(a));if(i>=0)return i;}return -1;}
function pgCleanCode(v){return String(v??"").trim().replace(/\\.0$/,"");}
function pgNumber(v){if(typeof v==="number")return Number.isFinite(v)?v:0;let x=String(v??"").trim().replace(/[^0-9,.-]/g,"");if(!x)return 0;if(x.includes(",")&&x.includes("."))x=x.replace(/\\./g,"").replace(",",".");else if(x.includes(","))x=x.replace(",",".");return Number(x)||0;}
function pgMoney(v){return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(pgNumber(v))+" TL";}
function pgCategory(v){const n=pgNorm(v);if(n.includes("ayakkabi")||n==="ftw"||n==="footwear")return "AYAKKABI";if(n.includes("tekstil")||n==="app"||n==="apparel")return "TEKSTİL";if(n.includes("aksesuar")||n==="acc"||n==="accessories")return "AKSESUAR";return String(v||"DİĞER").trim().toLocaleUpperCase("tr-TR");}

async function loadExcel(file){
 if(excelCache[file])return excelCache[file];
 if(!window.XLSX)throw new Error("Excel okuma kütüphanesi yüklenemedi. İnternet bağlantısını kontrol et.");
 const url="https://raw.githubusercontent.com/dagitmacmustafaberaat-create/puma-smart-assistant/main/"+encodeURIComponent(file).replace(/%2F/g,"/");
 const res=await fetch(url,{cache:"no-store"});
 if(!res.ok)throw new Error(file+" indirilemedi ("+res.status+").");
 const wb=XLSX.read(await res.arrayBuffer(),{type:"array",cellDates:true});
 const parsed={name:file,sheets:[]};
 wb.SheetNames.forEach(sheetName=>{
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:"",raw:false});
  let headerIndex=0,best=-1;
  raw.slice(0,20).forEach((row,i)=>{const score=row.filter(v=>String(v).trim()!=="").length;if(score>best){best=score;headerIndex=i}});
  const headers=(raw[headerIndex]||[]).map((v,i)=>String(v||"Sütun "+(i+1)).trim()||"Sütun "+(i+1));
  const rows=raw.slice(headerIndex+1).filter(row=>row.some(v=>String(v).trim()!==""));
  parsed.sheets.push({name:sheetName,headers,rows,total:rows.length});
 });
 excelCache[file]=parsed;return parsed;
}

function filterWeeklyCompare(value){
 const root=document.getElementById("weeklyCompareResults");if(!root)return;
 root.querySelectorAll("[data-compare-week]").forEach((week,wi)=>{
  const days=week.querySelectorAll("[data-compare-day]");
  const total=week.querySelector("[data-compare-total]");
  let showWeek=value==="all"||value==="week-"+wi;
  let showDay=false;
  days.forEach(day=>{
   const match=value==="all"||(value==="week-"+wi)||(value.startsWith("day-")&&Number(value.slice(4))===Number(day.dataset.compareDay));
   day.style.display=match?"":"none";if(match&&value.startsWith("day-"))showDay=true;
  });
  if(total)total.style.display=(value==="all"||value==="week-"+wi)?"":"none";
  week.style.display=(showWeek||showDay)?"":"none";
 });
}
// Tek merkezden, bütün modüller için güvenli sayfa yönlendirmesi.
go=function(page){
 const title=document.getElementById("pageTitle");
 const dashboard=document.getElementById("dashboardPage");
 const other=document.getElementById("otherPage");
 const intro=document.getElementById("pageIntro");
 const host=document.getElementById("pageContent");
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(title)title.textContent=titles[page]||"BUYAKA Store Intelligence";
 const isHome=page==="dashboard";
 dashboard.classList.toggle("hidden",!isHome);
 other.classList.toggle("hidden",isHome);
 if(isHome){window.scrollTo({top:0,behavior:"smooth"});return;}
 intro.textContent="";
 host.innerHTML='<div class="card"><p class="insight">Modül hazırlanıyor…</p></div>';
 try{
  if(page==="opportunities"){renderOpportunitiesPage();}
  else if(page==="ai"){renderAI();}
  else if(page==="coach"){
   const p=content.coach;
   if(!p)throw new Error("Akıllı Mağaza Koçu içeriği bulunamadı.");
   intro.textContent=p.intro;host.innerHTML=p.html;
  }else if(page==="people"){
   const p=content.people;
   intro.textContent=p.intro;
   host.innerHTML=p.html;
  }else{
   const p=content[page];
   if(!p)throw new Error("Bu menü için içerik tanımlanmamış: "+page);
   intro.textContent=p.intro||"";
   host.innerHTML=p.html||"";
   if(page==="data"||sourceMap[page]){
    renderExcelPage(page).catch(err=>{
     host.innerHTML='<div class="card"><h3>Veri modülü yüklenemedi</h3><p class="notice">'+esc(err.message||err)+'</p></div>';
    });
   }
  }
 }catch(err){
  console.error("Modül açılış hatası:",page,err);
  host.innerHTML='<div class="card"><div class="card-title"><h3>Modül açılırken hata oluştu</h3><span class="status">HATA</span></div><p class="notice">'+esc(err.message||err)+'</p></div>';
 }
 window.scrollTo({top:0,behavior:"smooth"});
};
window.addEventListener("error",e=>console.error("BUYAKA uygulama hatası:",e.message));
renderExecutiveDashboard();
</script></body></html>
