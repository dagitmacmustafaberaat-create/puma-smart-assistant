<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buyaka Puma Smart Stock Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- =========================
         BAŞLIK
    ========================== -->

    <div class="logo">
        BUYAKA PUMA
    </div>


    <div class="assistant-title">
        SMART STOCK ASSISTANT
    </div>


    <div class="red-line"></div>


    <div class="subtitle">
        Anlık Stok & Ürün Sorgulama
    </div>



    <!-- =========================
         ANA MENÜ
    ========================== -->

    <div
        id="mainMenu"
        class="main-menu"
    >


        <!-- ÜRÜN SORGULAMA -->

        <button
            class="menu-button"
            onclick="showProductSearch()"
        >

            <span class="menu-icon">
                ⌕
            </span>


            <span class="menu-text">

                <strong>
                    ÜRÜN SORGULAMA
                </strong>

                <small>
                    Ürün, barkod veya stok kodu ile arama yapın.
                </small>

            </span>


            <span class="menu-arrow">
                ›
            </span>

        </button>



        <!-- BEDEN BAZLI SORGULAMA -->

        <button
            class="menu-button"
            onclick="showSizeSearch()"
        >

            <span class="menu-icon">
                👟
            </span>


            <span class="menu-text">

                <strong>
                    BEDEN BAZLI SORGULAMA
                </strong>

                <small>
                    Bir beden seçerek stokta bulunan ürünleri görüntüleyin.
                </small>

            </span>


            <span class="menu-arrow">
                ›
            </span>

        </button>


    </div>



    <!-- =========================
         ÜRÜN SORGULAMA
    ========================== -->

    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >


        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>


        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün • Stok Kodu"
            autocomplete="off"
        >


        <div id="results"></div>


    </div>



    <!-- =========================
         BEDEN BAZLI SORGULAMA
    ========================== -->

    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >


        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>



        <div class="size-search-title">

            BEDEN BAZLI SORGULAMA

        </div>



        <div class="size-filter-info">

            Stokta bulunan bir bedeni seçin

        </div>



        <!-- BEDEN BUTONLARI -->

        <div
            id="sizeButtons"
            class="size-buttons"
        ></div>



        <!-- SEÇİLEN BEDEN -->

        <div
            id="selectedSizeLabel"
            class="selected-size-label"
        ></div>



        <!-- SONUÇLAR -->

        <div id="sizeResults"></div>


    </div>


</div>



<!-- =========================
     ANA SCRIPT
========================== -->

<script src="script.js"></script>



<!-- =========================
     MENÜ VE BEDEN SORGULAMA
========================== -->

<script>


/* =========================
   ANA MENÜ
========================= */

function showMainMenu() {


    document.getElementById(
        "mainMenu"
    ).style.display = "block";


    document.getElementById(
        "productSearchArea"
    ).style.display = "none";


    document.getElementById(
        "sizeSearchArea"
    ).style.display = "none";


    /* Eski beden seçimini temizle */

    const results =
        document.getElementById("sizeResults");

    if (results) {
        results.innerHTML = "";
    }


    const label =
        document.getElementById("selectedSizeLabel");

    if (label) {
        label.innerHTML = "";
    }

}



/* =========================
   ÜRÜN SORGULAMA
========================= */

function showProductSearch() {


    document.getElementById(
        "mainMenu"
    ).style.display = "none";


    document.getElementById(
        "productSearchArea"
    ).style.display = "block";


    document.getElementById(
        "sizeSearchArea"
    ).style.display = "none";


    setTimeout(() => {


        const input =
            document.getElementById(
                "searchInput"
            );


        if (input) {

            input.focus();

        }


    }, 100);

}



/* =========================
   BEDEN SORGULAMA
========================= */

function showSizeSearch() {


    document.getElementById(
        "mainMenu"
    ).style.display = "none";


    document.getElementById(
        "productSearchArea"
    ).style.display = "none";


    document.getElementById(
        "sizeSearchArea"
    ).style.display = "block";


    createSizeButtons();

}



/* =========================
   BEDENLERİ OLUŞTUR
========================= */

function createSizeButtons() {


    const container =
        document.getElementById(
            "sizeButtons"
        );


    if (!container) return;


    container.innerHTML = "";


    /*
       data.json henüz yüklenmediyse
    */

    if (
        typeof products === "undefined" ||
        !Array.isArray(products) ||
        products.length === 0
    ) {


        container.innerHTML = `

            <div class="notfound">

                ⏳ Stok verileri yükleniyor...

            </div>

        `;


        /*
           Biraz sonra tekrar dene
        */

        setTimeout(() => {

            createSizeButtons();

        }, 500);


        return;

    }



    /* =========================
       STOKTA OLAN BEDENLER
    ========================== */

    const sizes = new Set();


    products.forEach(item => {


        const size =
            String(
                item.beden || ""
            ).trim();


        const stock =
            Number(
                item.stok
            ) || 0;


        /*
           SADECE STOK > 0
        */

        if (
            size &&
            stock > 0
        ) {

            sizes.add(size);

        }

    });



    /* =========================
       BEDENLERİ SIRALA
    ========================== */

    const sortedSizes =
        Array.from(
            sizes
        ).sort((a, b) => {


            const aNum =
                parseFloat(a);


            const bNum =
                parseFloat(b);


            if (
                !isNaN(aNum) &&
                !isNaN(bNum)
            ) {

                return aNum - bNum;

            }


            return a.localeCompare(
                b,
                "tr-TR"
            );

        });



    /* Hiç beden yoksa */

    if (
        sortedSizes.length === 0
    ) {


        container.innerHTML = `

            <div class="notfound">

                ❌ Stokta beden bulunamadı.

            </div>

        `;


        return;

    }



    /* =========================
       BEDEN BUTONLARI
    ========================== */

    sortedSizes.forEach(size => {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "size-select-button";


        button.textContent =
            size;


        button.onclick =
            function () {


                /*
                   Önce bütün
                   butonlardan seçimi kaldır
                */

                document
                    .querySelectorAll(
                        ".size-select-button"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });


                /*
                   Tıklanan bedeni
                   seçili yap
                */

                button.classList.add(
                    "selected"
                );


                searchBySize(size);

            };


        container.appendChild(
            button
        );

    });

}



/* =========================
   BEDENE GÖRE ÜRÜN ARA
========================= */

function searchBySize(size) {


    const results =
        document.getElementById(
            "sizeResults"
        );


    const label =
        document.getElementById(
            "selectedSizeLabel"
        );


    if (!results) return;



    /* =========================
       SEÇİLEN BEDEN
    ========================== */

    const selectedSize =
        String(size)
            .trim()
            .toLocaleLowerCase(
                "tr-TR"
            );



    /* =========================
       SEÇİLEN BEDENİ GÖSTER
    ========================== */

    if (label) {


        label.innerHTML = `

            SEÇİLEN BEDEN:

            <strong>
                ${size}
            </strong>

        `;

    }



    /* =========================
       ÜRÜNLERİ FİLTRELE
    ========================== */

    const filtered =
        products.filter(item => {


            const itemSize =
                String(
                    item.beden || ""
                )
                .trim()
                .toLocaleLowerCase(
                    "tr-TR"
                );


            const stock =
                Number(
                    item.stok
                ) || 0;


            /*
               BEDEN AYNI
               VE
               STOK 0'DAN BÜYÜK
            */

            return (

                itemSize === selectedSize &&

                stock > 0

            );

        });



    /* =========================
       ÜRÜN YOK
    ========================== */

    if (
        filtered.length === 0
    ) {


        results.innerHTML = `

            <div class="notfound">

                ❌ ${size} bedeninde
                stokta ürün bulunamadı.

            </div>

        `;


        return;

    }



    /* =========================
       ÜRÜNLERİ GÖSTER
    ========================== */

    let html = "";



    filtered.forEach(item => {


        html += `

            <div class="product-card">


                <div class="product-name">

                    ${item.urun || "-"}

                </div>



                <div>

                    <strong>
                        Stok Kodu:
                    </strong>

                    ${item.stokKodu || "-"}

                </div>



                <div>

                    <strong>
                        Barkod:
                    </strong>

                    ${item.barkod || "-"}

                </div>



                <div>

                    <strong>
                        Renk:
                    </strong>

                    ${item.renk || "-"}

                </div>



                <div>

                    <strong>
                        Kategori:
                    </strong>

                    ${item.kategori || "-"}

                </div>



                <div>

                    <strong>
                        Cinsiyet:
                    </strong>

                    ${item.cinsiyet || "-"}

                </div>



                <div>

                    <strong>
                        Sezon:
                    </strong>

                    ${item.sezon || "-"}

                </div>



                <div class="size-title">

                    BEDEN / STOK

                </div>



                <div class="sizes">


                    <div
                        class="size-box low-stock"
                    >


                        <span class="size">

                            ${item.beden || "-"}

                        </span>


                        <span class="quantity">

                            ${Number(item.stok) || 0}

                        </span>


                    </div>


                </div>


            </div>

        `;

    });



    results.innerHTML =
        html;

}


</script>


</body>

</html>
