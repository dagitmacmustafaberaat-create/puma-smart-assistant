<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BUYAKA PUMA SMART ASSISTANT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="logo">
        BUYAKA PUMA SMART ASSISTANT
    </div>

    <div class="subtitle">
        Anlık Stok Sorgulama
    </div>


    <!-- ANA MENÜ -->
    <div id="mainMenu" class="menu">

        <button
            class="menu-button"
            type="button"
            onclick="showProductSearch()"
        >
            🔎 ÜRÜN SORGULAMA
        </button>

        <button
            class="menu-button"
            type="button"
            onclick="showSizeSearch()"
        >
            👟 BEDEN BAZLI SORGULAMA
        </button>

    </div>


    <!-- ÜRÜN SORGULAMA -->
    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            type="button"
            onclick="showMainMenu()"
        >
            ← Ana Menü
        </button>

        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün Kodu • Ürün Adı"
            autocomplete="off"
        >

        <div id="results" class="results"></div>

    </div>


    <!-- BEDEN BAZLI SORGULAMA -->
    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            type="button"
            onclick="showMainMenu()"
        >
            ← Ana Menü
        </button>

        <select
            id="sizeFilter"
            class="size-select"
            onchange="searchBySize(this.value)"
        >
            <option value="">
                Beden seçiniz
            </option>
        </select>

        <div
            id="selectedSizeLabel"
            class="selected-size"
        ></div>

        <div
            id="sizeResults"
            class="results"
        ></div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
