<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUMA SMART ASSISTANT</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:white;
padding:20px;
}

header{
background:#d6001c;
padding:20px;
font-size:28px;
font-weight:bold;
text-align:center;
border-radius:10px;
margin-bottom:20px;
}

input{
width:100%;
padding:16px;
font-size:18px;
border-radius:8px;
border:none;
margin-bottom:20px;
}

.card{
background:#1f1f1f;
padding:20px;
border-radius:12px;
margin-bottom:15px;
border-left:6px solid #d6001c;
}

.card h2{
margin-bottom:10px;
color:#fff;
}

.item{
margin:8px 0;
font-size:18px;
}

.yok{
text-align:center;
font-size:22px;
padding:30px;
background:#222;
border-radius:12px;
}
</style>

</head>

<body>

<header>
PUMA SMART ASSISTANT
</header>

<input
type="text"
id="arama"
placeholder="Barkod • Stok Kodu • Ürün Adı"
onkeyup="ara()"
/>

<div id="sonuc"></div>

<script>

let urunler=[];

fetch("veri.json")
.then(x=>x.json())
.then(veri=>{
urunler=veri;
});

function ara(){

let kelime=document
.getElementById("arama")
.value
.toLowerCase()
.trim();

let bulunan=urunler.filter(x=>

String(x.barkod).toLowerCase().includes(kelime)

||

String(x.stokKodu).toLowerCase().includes(kelime)

||

String(x.urun).toLowerCase().includes(kelime)

);

let alan=document.getElementById("sonuc");

if(bulunan.length==0){

alan.innerHTML='<div class="yok">Ürün Bulunamadı</div>';

return;

}

alan.innerHTML="";

bulunan.forEach(u=>{

alan.innerHTML+=`

<div class="card">

<h2>${u.urun}</h2>

<div class="item"><b>Barkod :</b> ${u.barkod}</div>

<div class="item"><b>Stok Kodu :</b> ${u.stokKodu}</div>

<div class="item"><b>Renk :</b> ${u.renk}</div>

<div class="item"><b>Beden :</b> ${u.beden}</div>

<div class="item"><b>Stok :</b> ${u.stok}</div>

</div>

`;

});

}

</script>

</body>
</html>
