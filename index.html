```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buyaka Puma Smart Stock Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BAŞLIK -->

    <div class="logo">
        BUYAKA PUMA
    </div>

    <div class="assistant-title">
        SMART STOCK ASSISTANT
    </div>

    <div class="red-line"></div>

    <div class="subtitle">
        Anlık Stok & Ürün Sorgulama
    </div>


    <!-- ANA MENÜ -->

    <div id="mainMenu" class="main-menu">

        <button
            class="menu-button"
            onclick="showProductSearch()"
        >

            <span class="menu-icon">⌕</span>

            <span class="menu-text">
                <strong>ÜRÜN SORGULAMA</strong>

                <small>
                    Ürün, barkod veya stok kodu ile arama yapın.
                </small>
            </span>

            <span class="menu-arrow">›</span>

        </button>


        <button
            class="menu-button"
            onclick="showSizeSearch()"
        >

            <span class="menu-icon">👟</span>

            <span class="menu-text">
                <strong>BEDEN BAZLI SORGULAMA</strong>

                <small>
                    Beden seçerek stokta bulunan ürünleri görüntüleyin.
                </small>
            </span>

            <span class="menu-arrow">›</span>

        </button>

    </div>


    <!-- ÜRÜN SORGULAMA -->

    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>

        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün • Stok Kodu"
            autocomplete="off"
        >

        <div id="results"></div>

    </div>


    <!-- BEDEN BAZLI SORGULAMA -->

    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>

        <div class="size-search-title">
            BEDEN BAZLI SORGULAMA
        </div>

        <div class="size-filter-info">
            Stokta bulunan bir bedeni seçin
        </div>

        <select
            id="sizeFilter"
            class="size-filter"
            onchange="searchBySize(this.value)"
        >

            <option value="">
                Beden seçiniz
            </option>

        </select>

        <div
            id="selectedSizeLabel"
            class="selected-size-label"
        ></div>

        <div id="sizeResults"></div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
```
