<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BUYAKA PUMA SMART ASSISTANT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="logo">
        BUYAKA PUMA SMART ASSISTANT
    </div>

    <div class="assistant-title">
        SMART STOCK ASSISTANT
    </div>

    <div class="red-line"></div>

    <div class="subtitle">
        Anlık Stok Sorgulama
    </div>


    <!-- ANA MENÜ -->
    <div id="mainMenu" class="main-menu">

        <button
            id="productButton"
            class="menu-button"
            type="button"
        >
            <div class="menu-icon">🔎</div>

            <div class="menu-text">
                <strong>ÜRÜN SORGULAMA</strong>
                <small>
                    Barkod, ürün kodu veya ürün adı ile stok sorgula
                </small>
            </div>

            <div class="menu-arrow">›</div>
        </button>


        <button
            id="sizeButton"
            class="menu-button"
            type="button"
        >
            <div class="menu-icon">👟</div>

            <div class="menu-text">
                <strong>BEDEN BAZLI SORGULAMA</strong>
                <small>
                    Seçtiğin bedende bulunan ürünleri görüntüle
                </small>
            </div>

            <div class="menu-arrow">›</div>
        </button>

    </div>


    <!-- ÜRÜN SORGULAMA -->
    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            id="backProduct"
            class="back-button"
            type="button"
        >
            ← Ana Menü
        </button>

        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün Kodu • Ürün Adı"
            autocomplete="off"
        >

        <div id="results"></div>

    </div>


    <!-- BEDEN SORGULAMA -->
    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            id="backSize"
            class="back-button"
            type="button"
        >
            ← Ana Menü
        </button>

        <div class="size-search-title">
            BEDEN BAZLI SORGULAMA
        </div>

        <div class="size-filter-info">
            Mevcut stok bulunan bedeni seçiniz.
        </div>

        <select
            id="sizeFilter"
            class="size-filter"
        >
            <option value="">
                Beden seçiniz
            </option>
        </select>

        <div id="sizeResults"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
