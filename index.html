```html
<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buyaka Puma Smart Stock Assistant</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo">
    BUYAKA PUMA
</div>

<div class="assistant-title">
    SMART STOCK ASSISTANT
</div>

<div class="red-line"></div>

<div class="subtitle">
    Anlık Stok & Ürün Sorgulama
</div>


<!-- ANA MENÜ -->

<div id="mainMenu" class="main-menu">

    <button class="menu-button" id="productButton">

        <span class="menu-icon">⌕</span>

        <span class="menu-text">
            <strong>ÜRÜN SORGULAMA</strong>
            <small>
                Ürün, barkod veya stok kodu ile arama yapın.
            </small>
        </span>

        <span class="menu-arrow">›</span>

    </button>


    <button class="menu-button" id="sizeButton">

        <span class="menu-icon">👟</span>

        <span class="menu-text">
            <strong>BEDEN BAZLI SORGULAMA</strong>
            <small>
                Bir beden seçin ve o bedendeki stokları görüntüleyin.
            </small>
        </span>

        <span class="menu-arrow">›</span>

    </button>

</div>


<!-- ÜRÜN SORGULAMA -->

<div id="productSearchArea"
     class="search-area"
     style="display:none;">

    <button class="back-button" id="backProduct">
        ‹ ANA MENÜ
    </button>

    <input
        type="text"
        id="searchInput"
        placeholder="Barkod • Ürün • Stok Kodu"
        autocomplete="off"
    >

    <div id="results"></div>

</div>


<!-- BEDEN BAZLI SORGULAMA -->

<div id="sizeSearchArea"
     class="search-area"
     style="display:none;">

    <button class="back-button" id="backSize">
        ‹ ANA MENÜ
    </button>

    <div class="size-search-title">
        BEDEN BAZLI SORGULAMA
    </div>

    <div class="size-filter-info">
        Stokta bulunan bedeni seçin
    </div>

    <select id="sizeFilter" class="size-filter">

        <option value="">
            Beden seçiniz
        </option>

    </select>

    <div id="selectedSizeLabel"
         class="selected-size-label">
    </div>

    <div id="sizeResults"></div>

</div>


<script>

let products = [];


// ======================================================
// VERİLERİ YÜKLE
// ======================================================

async function loadProducts() {

    try {

        const response =
            await fetch("./data.json");

        if (!response.ok) {
            throw new Error("data.json bulunamadı");
        }

        products =
            await response.json();

        console.log(
            "Ürün sayısı:",
            products.length
        );

        createSizeList();

    } catch (error) {

        console.error(
            "VERİ HATASI:",
            error
        );

        const results =
            document.getElementById("results");

        if (results) {

            results.innerHTML =
                "<div class='notfound'>" +
                "❌ Stok verisi okunamadı." +
                "</div>";

        }

    }

}


// ======================================================
// ANA MENÜ
// ======================================================

function mainMenu() {

    document.getElementById(
        "mainMenu"
    ).style.display = "flex";

    document.getElementById(
        "productSearchArea"
    ).style.display = "none";

    document.getElementById(
        "sizeSearchArea"
    ).style.display = "none";

}


// ======================================================
// ÜRÜN SORGULAMA
// ======================================================

function openProductSearch() {

    document.getElementById(
        "mainMenu"
    ).style.display = "none";

    document.getElementById(
        "productSearchArea"
    ).style.display = "block";

    document.getElementById(
        "sizeSearchArea"
    ).style.display = "none";

    setTimeout(function () {

        document.getElementById(
            "searchInput"
        ).focus();

    }, 100);

}


// ======================================================
// BEDEN SORGULAMA
// ======================================================

function openSizeSearch() {

    document.getElementById(
        "mainMenu"
    ).style.display = "none";

    document.getElementById(
        "productSearchArea"
    ).style.display = "none";

    document.getElementById(
        "sizeSearchArea"
    ).style.display = "block";

    createSizeList();

}


// ======================================================
// BEDEN LİSTESİ
// ======================================================

function createSizeList() {

    const select =
        document.getElementById(
            "sizeFilter"
        );

    if (!select) return;

    const sizes = [];

    products.forEach(function(item) {

        const size =
            String(
                item.beden || ""
            ).trim();

        const stock =
            Number(item.stok) || 0;

        if (
            size &&
            stock > 0 &&
            !sizes.includes(size)
        ) {

            sizes.push(size);

        }

    });


    sizes.sort(function(a, b) {

        const numA =
            parseFloat(a);

        const numB =
            parseFloat(b);

        if (
            !isNaN(numA) &&
            !isNaN(numB)
        ) {

            return numA - numB;

        }

        return a.localeCompare(
            b,
            "tr-TR"
        );

    });


    select.innerHTML =
        '<option value="">Beden seçiniz</option>';


    sizes.forEach(function(size) {

        const option =
            document.createElement(
                "option"
            );

        option.value = size;

        option.textContent = size;

        select.appendChild(
            option
        );

    });

}


// ======================================================
// BEDEN SEÇİMİ
// ======================================================

function searchBySize(size) {

    const results =
        document.getElementById(
            "sizeResults"
        );

    const label =
        document.getElementById(
            "selectedSizeLabel"
        );


    if (!size) {

        label.innerHTML = "";

        results.innerHTML = "";

        return;

    }


    label.innerHTML =
        "SEÇİLEN BEDEN: <strong>" +
        size +
        "</strong>";


    const found =
        products.filter(function(item) {

            return (
                String(
                    item.beden || ""
                ).trim() === size &&

                Number(
                    item.stok
                ) > 0
            );

        });


    if (!found.length) {

        results.innerHTML =
            "<div class='notfound'>" +
            "❌ Bu bedende stokta ürün bulunamadı." +
            "</div>";

        return;

    }


    let html = "";


    found.forEach(function(item) {

        html +=

            '<div class="product-card">' +

            '<div class="product-name">' +
            (item.urun || "-") +
            '</div>' +

            '<div>' +
            '<strong>Stok Kodu:</strong> ' +
            (item.stokKodu || "-") +
            '</div>' +

            '<div>' +
            '<strong>Renk:</strong> ' +
            (item.renk || "-") +
            '</div>' +

            '<div>' +
            '<strong>Beden:</strong> ' +
            (item.beden || "-") +
            '</div>' +

            '<div>' +
            '<strong>Stok:</strong> ' +
            (item.stok || 0) +
            '</div>' +

            '</div>';

    });


    results.innerHTML = html;

}


// ======================================================
// ÜRÜN ARAMA
// ======================================================

function searchProducts(text) {

    const results =
        document.getElementById(
            "results"
        );


    text =
        String(text || "")
        .trim()
        .toLocaleLowerCase(
            "tr-TR"
        );


    if (!text) {

        results.innerHTML = "";

        return;

    }


    const found =
        products.filter(function(item) {

            return (

                String(
                    item.barkod || ""
                )
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(text)

                ||

                String(
                    item.stokKodu || ""
                )
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(text)

                ||

                String(
                    item.urun || ""
                )
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(text)

                ||

                String(
                    item.renk || ""
                )
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(text)

            );

        });


    if (!found.length) {

        results.innerHTML =
            "<div class='notfound'>" +
            "❌ Ürün bulunamadı." +
            "</div>";

        return;

    }


    let html = "";


    found.forEach(function(item) {

        html +=

            '<div class="product-card">' +

            '<div class="product-name">' +
            (item.urun || "-") +
            '</div>' +

            '<div>' +
            '<strong>Stok Kodu:</strong> ' +
            (item.stokKodu || "-") +
            '</div>' +

            '<div>' +
            '<strong>Renk:</strong> ' +
            (item.renk || "-") +
            '</div>' +

            '<div>' +
            '<strong>Beden:</strong> ' +
            (item.beden || "-") +
            '</div>' +

            '<div>' +
            '<strong>Stok:</strong> ' +
            (item.stok || 0) +
            '</div>' +

            '</div>';

    });


    results.innerHTML = html;

}


// ======================================================
// BUTONLAR
// ======================================================

document.getElementById(
    "productButton"
).addEventListener(
    "click",
    openProductSearch
);


document.getElementById(
    "sizeButton"
).addEventListener(
    "click",
    openSizeSearch
);


document.getElementById(
    "backProduct"
).addEventListener(
    "click",
    mainMenu
);


document.getElementById(
    "backSize"
).addEventListener(
    "click",
    mainMenu
);


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        searchProducts(
            this.value
        );

    }
);


document.getElementById(
    "sizeFilter"
).addEventListener(
    "change",
    function() {

        searchBySize(
            this.value
        );

    }
);


// ======================================================
// BAŞLAT
// ======================================================

loadProducts();

</script>

</body>
</html>
```
