<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buyaka Puma Smart Stock Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- BAŞLIK -->

    <div class="logo">
        BUYAKA PUMA
    </div>

    <div class="assistant-title">
        SMART STOCK ASSISTANT
    </div>

    <div class="red-line"></div>

    <div class="subtitle">
        Anlık Stok & Ürün Sorgulama
    </div>


    <!-- ANA MENÜ -->

    <div id="mainMenu" class="main-menu">

        <button
            class="menu-button"
            onclick="showProductSearch()"
        >

            <span class="menu-icon">⌕</span>

            <span class="menu-text">

                <strong>ÜRÜN SORGULAMA</strong>

                <small>
                    Ürün, barkod veya stok kodu ile arama yapın.
                </small>

            </span>

            <span class="menu-arrow">›</span>

        </button>


        <button
            class="menu-button"
            onclick="showSizeSearch()"
        >

            <span class="menu-icon">👟</span>

            <span class="menu-text">

                <strong>BEDEN BAZLI SORGULAMA</strong>

                <small>
                    Beden seçerek stokta bulunan ürünleri görüntüleyin.
                </small>

            </span>

            <span class="menu-arrow">›</span>

        </button>

    </div>


    <!-- ÜRÜN SORGULAMA -->

    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>

        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün • Stok Kodu"
            autocomplete="off"
        >

        <div id="results"></div>

    </div>


    <!-- BEDEN BAZLI SORGULAMA -->

    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="showMainMenu()"
        >
            ‹ ANA MENÜ
        </button>


        <div class="size-search-title">
            BEDEN BAZLI SORGULAMA
        </div>


        <div class="size-filter-info">
            Stokta bulunan bir bedeni seçin
        </div>


        <!-- BEDEN FİLTRESİ -->

        <select
            id="sizeFilter"
            class="size-filter"
            onchange="searchBySize(this.value)"
        >

            <option value="">
                Beden seçiniz
            </option>

        </select>


        <!-- SEÇİLEN BEDEN -->

        <div
            id="selectedSizeLabel"
            class="selected-size-label"
        ></div>


        <!-- BEDEN SONUÇLARI -->

        <div id="sizeResults"></div>

    </div>

</div>


<script src="script.js"></script>


<script>

/* =========================
   ANA MENÜ
========================= */

function showMainMenu() {

    document.getElementById("mainMenu").style.display = "block";

    document.getElementById("productSearchArea").style.display = "none";

    document.getElementById("sizeSearchArea").style.display = "none";


    const results =
        document.getElementById("sizeResults");

    if (results) {
        results.innerHTML = "";
    }


    const label =
        document.getElementById("selectedSizeLabel");

    if (label) {
        label.innerHTML = "";
    }


    const filter =
        document.getElementById("sizeFilter");

    if (filter) {
        filter.value = "";
    }

}


/* =========================
   ÜRÜN SORGULAMA
========================= */

function showProductSearch() {

    document.getElementById("mainMenu").style.display = "none";

    document.getElementById("productSearchArea").style.display = "block";

    document.getElementById("sizeSearchArea").style.display = "none";


    setTimeout(() => {

        const input =
            document.getElementById("searchInput");

        if (input) {
            input.focus();
        }

    }, 100);

}


/* =========================
   BEDEN SORGULAMA
========================= */

function showSizeSearch() {

    document.getElementById("mainMenu").style.display = "none";

    document.getElementById("productSearchArea").style.display = "none";

    document.getElementById("sizeSearchArea").style.display = "block";

    createSizeFilter();

}


/* =========================
   BEDEN FİLTRESİNİ OLUŞTUR
========================= */

function createSizeFilter() {

    const filter =
        document.getElementById("sizeFilter");

    if (!filter) return;


    filter.innerHTML = `
        <option value="">
            Beden seçiniz
        </option>
    `;


    if (
        typeof products === "undefined" ||
        !Array.isArray(products) ||
        products.length === 0
    ) {

        setTimeout(() => {
            createSizeFilter();
        }, 500);

        return;
    }


    const sizes = new Set();


    products.forEach(item => {

        const size =
            String(item.beden || "").trim();

        const stock =
            Number(item.stok) || 0;


        /*
           SADECE STOKTA OLAN
           BEDENLER
        */

        if (
            size &&
            stock > 0
        ) {

            sizes.add(size);

        }

    });


    const sortedSizes =
        Array.from(sizes).sort((a, b) => {

            const aNum = parseFloat(a);

            const bNum = parseFloat(b);


            if (
                !isNaN(aNum) &&
                !isNaN(bNum)
            ) {

                return aNum - bNum;

            }


            return a.localeCompare(
                b,
                "tr-TR"
            );

        });


    sortedSizes.forEach(size => {

        const option =
            document.createElement("option");

        option.value = size;

        option.textContent =
            `${size} BEDEN`;

        filter.appendChild(option);

    });

}


/* =========================
   BEDENE GÖRE SORGULA
========================= */

function searchBySize(size) {

    const results =
        document.getElementById("sizeResults");

    const label =
        document.getElementById("selectedSizeLabel");


    if (!results) return;


    if (!size) {

        results.innerHTML = "";

        if (label) {
            label.innerHTML = "";
        }

        return;

    }


    const selectedSize =
        String(size)
            .trim()
            .toLocaleLowerCase("tr-TR");


    if (label) {

        label.innerHTML = `
            SEÇİLEN BEDEN:
            <strong>${size}</strong>
        `;

    }


    /*
       BEDEN AYNI
       VE
       STOK 0'DAN BÜYÜK
    */

    const filtered =
        products.filter(item => {

            const itemSize =
                String(item.beden || "")
                    .trim()
                    .toLocaleLowerCase("tr-TR");

            const stock =
                Number(item.stok) || 0;


            return (
                itemSize === selectedSize &&
                stock > 0
            );

        });


    if (filtered.length === 0) {

        results.innerHTML = `
            <div class="notfound">
                ❌ ${size} bedeninde stokta ürün bulunamadı.
            </div>
        `;

        return;

    }


    let html = "";


    filtered.forEach(item => {

        html += `

            <div class="product-card">

                <div class="product-name">
                    ${item.urun || "-"}
                </div>


                <div>
                    <strong>Stok Kodu:</strong>
                    ${item.stokKodu || "-"}
                </div>


                <div>
                    <strong>Barkod:</strong>
                    ${item.barkod || "-"}
                </div>


                <div>
                    <strong>Renk:</strong>
                    ${item.renk || "-"}
                </div>


                <div>
                    <strong>Kategori:</strong>
                    ${item.kategori || "-"}
                </div>


                <div>
                    <strong>Cinsiyet:</strong>
                    ${item.cinsiyet || "-"}
                </div>


                <div>
                    <strong>Sezon:</strong>
                    ${item.sezon || "-"}
                </div>


                <div class="size-title">
                    BEDEN / STOK
                </div>


                <div class="sizes">

                    <div class="size-box">

                        <span class="size">
                            ${item.beden || "-"}
                        </span>

                        <span class="quantity">
                            ${Number(item.stok) || 0}
                        </span>

                    </div>

                </div>

            </div>

        `;

    });


    results.innerHTML = html;

}

</script>

</body>

</html>
