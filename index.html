<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BUYAKA PUMA SMART ASSISTANT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- AÇILIŞ EKRANI: TEK BUTON -->
    <div id="landingScreen" style="max-width:520px;margin:35vh auto 0;padding:20px;">
        <button class="menu-button" type="button" onclick="showProductSearch()">
            BUYAKA PUMA STORE
        </button>
    </div>

    <!-- Eski ana menü; arayüzde gösterilmez -->
    <div id="mainMenu" class="menu" style="display:none;"></div>

    <!-- ÜRÜN SORGULAMA -->
    <div
        id="productSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            type="button"
            onclick="showMainMenu()"
        >
            ← Ana Menü
        </button>

        <input
            type="text"
            id="searchInput"
            placeholder="Barkod • Ürün Kodu • Ürün Adı"
            autocomplete="off"
        >

        <div id="results" class="results"></div>

    </div>

    <!-- BEDEN BAZLI SORGULAMA -->
    <div
        id="sizeSearchArea"
        class="search-area"
        style="display:none;"
    >

        <button
            class="back-button"
            type="button"
            onclick="showMainMenu()"
        >
            ← Ana Menü
        </button>

        <select
            id="sizeFilter"
            class="size-select"
            onchange="searchBySize(this.value)"
        >
            <option value="">
                Beden seçiniz
            </option>
        </select>

        <div
            id="selectedSizeLabel"
            class="selected-size"
        ></div>

        <div
            id="sizeResults"
            class="results"
        ></div>

    </div>

    <section id="educationArea" class="education-area" style="display:none;">
      <button class="back-button" type="button" onclick="closeEducationCenter()">← Ana Menü</button>
      <header class="education-heading">
        <p class="education-eyebrow">BUYAKA PUMA • PERSONEL GELİŞİMİ</p>
        <h1>EKİM 2026 EĞİTİM TAKVİMİ</h1>
        <p>Günün konularını incele; bir konu kartına tıklayarak eğitim dokümanını aç.</p>
      </header>
      <section id="todayTraining" class="today-training"></section>
      <div class="calendar-title-row"><h2>Aylık Eğitim Planı</h2><span>1–31 Ekim 2026</span></div>
      <div id="educationCalendar" class="education-calendar"><div class="notfound">Eğitim takvimi yükleniyor…</div></div>
      <footer class="education-footer"><p>Tüm eğitim dokümanları tek PDF dosyasında</p><button type="button" class="pdf-button" onclick="openEducationPDF()">📖 Tüm Eğitim Dokümanlarını Aç</button></footer>
    </section>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
    <script src="education.js"></script>

</body>

</html>
