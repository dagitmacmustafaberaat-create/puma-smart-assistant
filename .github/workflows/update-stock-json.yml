name: Update stock and store performance data

on:
  push:
    branches:
      - main
    paths:
      - "Güncel Stok.xlsx"
      - "Ekim 2026 Data.xlsx"
      - "generate_data_json.py"
      - "generate_performance_json.py"
      - ".github/workflows/update-stock-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Excel dependencies
        run: pip install pandas openpyxl
      - name: Generate stock data JSON
        run: python generate_data_json.py
      - name: Generate store performance JSON
        run: python generate_performance_json.py
      - name: Commit generated JSON files
        run: |
          if git diff --quiet -- data.json performance-data.json; then
            echo "Generated JSON files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json performance-data.json
          git commit -m "Update stock and store performance data from Excel"
          git push
