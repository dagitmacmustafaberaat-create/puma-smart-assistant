<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BUYAKA PUMA — Yönetici Şifre Kurtarma</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111;color:#fff;font:16px Arial,sans-serif}
    main{width:min(100%,440px);padding:28px;border:1px solid #444;border-radius:16px;background:#1c1c1c}
    h1{font-size:22px;margin:0 0 8px}p{color:#ccc;line-height:1.5;font-size:14px}
    label{display:block;margin:18px 0 7px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #666;border-radius:8px;background:#fff;color:#111;font-size:16px}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#e21b2d;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.msg{margin-top:16px;padding:12px;border-radius:8px;white-space:pre-wrap}.error{background:#4a171b}.success{background:#17452c}
  </style>
</head>
<body>
<main>
  <h1>Yönetici şifresini yenile</h1>
  <p>Bu kurtarma işlemi tek kullanımlıktır. Vercel'de MANAGER_RECOVERY_TOKEN olarak kaydettiğiniz gizli anahtarı girin. Anahtarı kimseyle paylaşmayın.</p>
  <form id="form">
    <label for="token">Kurtarma anahtarı</label>
    <input id="token" type="password" autocomplete="off" required>
    <label for="password">Yeni şifre (en az 12 karakter)</label>
    <input id="password" type="password" minlength="12" autocomplete="new-password" required>
    <label for="confirm">Yeni şifreyi tekrar yaz</label>
    <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
    <button id="submit" type="submit">Yönetici şifresini güncelle</button>
    <div id="message" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const token = document.getElementById("token").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const message = document.getElementById("message");
  const button = document.getElementById("submit");
  message.className = "msg";
  message.textContent = "";
  if (password !== confirm) { message.classList.add("error"); message.textContent = "Şifreler eşleşmiyor."; return; }
  button.disabled = true;
  try {
    const response = await fetch("/api/manager-recovery", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "İşlem başarısız.");
    message.classList.add("success");
    message.textContent = data.message;
    document.getElementById("form").reset();
  } catch (error) {
    message.classList.add("error");
    message.textContent = error.message;
  } finally { button.disabled = false; }
});
</script>
</body>
</html>
